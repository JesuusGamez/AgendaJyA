<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jesús & Ali - Finanzas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #e11d48;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--text);
      font-weight: 700;
    }

    header h1 span {
      color: var(--accent);
    }

    /* Pestañas */
    .tabs-nav {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-content.active {
      display: flex;
    }

    /* Indicador de Fecha / Filtro */
    .date-indicator {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: #0f172a;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .filter-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .filter-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="month"] {
      background: #1e293b;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      width: 100%;
      text-align: center;
    }

    /* Columnas */
    .columns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .col {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
    }

    .col h2 {
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .title-ingresos { color: var(--green); }
    .title-gastos { color: var(--red); }

    .items-list {
      list-style: none;
      flex-grow: 1;
      overflow-y: auto;
      max-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .items-list li {
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--border);
    }

    .items-list.ingresos li { border-left-color: var(--green); }
    .items-list.gastos li { border-left-color: var(--red); }

    /* Botón Eliminar ✕ */
    .delete-btn {
      color: var(--text-muted);
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .delete-btn:hover { 
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
    }

    .add-btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1e293b;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:active {
      transform: scale(0.98);
      background: var(--accent);
    }

    /* Resumen */
    .summary-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-item .label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .summary-item .value {
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Jesús <span>&</span> Ali</h1>
    </header>

    <!-- Navegación -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('daily', event)">☀️ Hoy</button>
      <button class="tab-btn" onclick="switchTab('monthly', event)">📅 Consulta Mensual</button>
    </div>

    <!-- PESTAÑA 1: DÍA A DÍA -->
    <div id="tab-daily" class="tab-content active">
      <div class="date-indicator" id="todayLabel"></div>

      <div class="columns-grid">
        <div class="col">
          <h2 class="title-ingresos">Ingresos</h2>
          <ul class="items-list ingresos" id="dailyIngresosList"></ul>
          <button class="add-btn" onclick="addRecord('ingreso')">+ Añadir</button>
        </div>
        <div class="col">
          <h2 class="title-gastos">Gastos</h2>
          <ul class="items-list gastos" id="dailyGastosList"></ul>
          <button class="add-btn" onclick="addRecord('gasto')">+ Añadir</button>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-item">
          <span class="label">Ingresos del Día</span>
          <span class="value" id="dailyTotalIngresos" style="color: var(--green);">$0</span>
        </div>
        <div class="summary-item">
          <span class="label">Gastos del Día</span>
          <span class="value" id="dailyTotalGastos" style="color: var(--red);">$0</span>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: CONSULTA MENSUAL -->
    <div id="tab-monthly" class="tab-content">
      <div class="filter-box">
        <label for="monthPicker">Seleccionar Mes a Consultar</label>
        <input type="month" id="monthPicker" onchange="renderData()">
      </div>

      <div class="columns-grid">
        <div class="col">
          <h2 class="title-ingresos">Ingresos Mes</h2>
          <ul class="items-list ingresos" id="monthlyIngresosList"></ul>
        </div>
        <div class="col">
          <h2 class="title-gastos">Gastos Mes</h2>
          <ul class="items-list gastos" id="monthlyGastosList"></ul>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-item">
          <span class="label">Total Ingresos Mes</span>
          <span class="value" id="monthlyTotalIngresos" style="color: var(--green);">$0</span>
        </div>
        <div class="summary-item">
          <span class="label">Total Gastos Mes</span>
          <span class="value" id="monthlyTotalGastos" style="color: var(--red);">$0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuración Firebase con tus llaves reales
    const firebaseConfig = {
      apiKey: "AIzaSyCbsHxOR1w4gDjQCAV0cdej3CEp83-WQs0",
      authDomain: "agendajya-94e6c.firebaseapp.com",
      databaseURL: "https://agendajya-94e6c-default-rtdb.firebaseio.com",
      projectId: "agendajya-94e6c",
      storageBucket: "agendajya-94e6c.firebasestorage.app",
      messagingSenderId: "195399447529",
      appId: "1:195399447529:web:b708fb0ff0da63ac481178",
      measurementId: "G-7B1H0QLFRG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Variables de fecha
    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);
    const currentMonthStr = today.toISOString().slice(0, 7);

    document.getElementById('todayLabel').innerText = `Hoy: ${today.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
    
    const monthPicker = document.getElementById('monthPicker');
    monthPicker.value = currentMonthStr;

    let allRecords = {};

    // Cambiar Pestañas
    function switchTab(tab, e) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      e.target.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    // Escuchar cambios en la nube
    db.ref('registros').on('value', (snapshot) => {
      allRecords = snapshot.val() || {};
      renderData();
    });

    // Añadir Registro
    function addRecord(type) {
      const desc = prompt(`Descripción del ${type}:`);
      if (!desc) return;

      const amount = parseFloat(prompt(`Monto ($):`));
      if (isNaN(amount) || amount <= 0) {
        alert("Ingresa un monto válido.");
        return;
      }

      const newRef = db.ref('registros').push();
      newRef.set({
        type: type,
        description: desc,
        amount: amount,
        date: new Date().toISOString()
      });
    }

    // ELIMINAR REGISTRO DE FIREBASE
    function deleteRecord(id) {
      if (confirm("¿Estás seguro de borrar este registro?")) {
        db.ref('registros/' + id).remove();
      }
    }

    // Renderizar Listas y Totales
    function renderData() {
      // Día
      const dailyIngresos = document.getElementById('dailyIngresosList');
      const dailyGastos = document.getElementById('dailyGastosList');
      dailyIngresos.innerHTML = '';
      dailyGastos.innerHTML = '';
      let dailyTotalIng = 0, dailyTotalGas = 0;

      // Mes
      const selectedMonth = monthPicker.value;
      const monthlyIngresos = document.getElementById('monthlyIngresosList');
      const monthlyGastos = document.getElementById('monthlyGastosList');
      monthlyIngresos.innerHTML = '';
      monthlyGastos.innerHTML = '';
      let monthlyTotalIng = 0, monthlyTotalGas = 0;

      Object.keys(allRecords).forEach(key => {
        const item = allRecords[key];
        const itemDateStr = item.date ? item.date.slice(0, 10) : "";
        const itemMonthStr = item.date ? item.date.slice(0, 7) : "";

        // Vista Diaria (Solo hoy)
        if (itemDateStr === todayStr) {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${item.description} (<b>$${item.amount.toLocaleString()}</b>)</span>
            <span class="delete-btn" onclick="deleteRecord('${key}')">✕</span>
          `;
          if (item.type === 'ingreso') {
            dailyIngresos.appendChild(li);
            dailyTotalIng += item.amount;
          } else {
            dailyGastos.appendChild(li);
            dailyTotalGas += item.amount;
          }
        }

        // Vista Mensual (Mes seleccionado)
        if (itemMonthStr === selectedMonth) {
          const li = document.createElement('li');
          const dayNum = new Date(item.date).getDate();
          li.innerHTML = `
            <span><small style="color:#94a3b8">${dayNum}d -</small> ${item.description} (<b>$${item.amount.toLocaleString()}</b>)</span>
            <span class="delete-btn" onclick="deleteRecord('${key}')">✕</span>
          `;
          if (item.type === 'ingreso') {
            monthlyIngresos.appendChild(li);
            monthlyTotalIng += item.amount;
          } else {
            monthlyGastos.appendChild(li);
            monthlyTotalGas += item.amount;
          }
        }
      });

      // Actualizar Totales en pantalla
      document.getElementById('dailyTotalIngresos').innerText = `$${dailyTotalIng.toLocaleString()}`;
      document.getElementById('dailyTotalGastos').innerText = `$${dailyTotalGas.toLocaleString()}`;
      document.getElementById('monthlyTotalIngresos').innerText = `$${monthlyTotalIng.toLocaleString()}`;
      document.getElementById('monthlyTotalGastos').innerText = `$${monthlyTotalGas.toLocaleString()}`;
    }
  </script>
</body>
</html>
