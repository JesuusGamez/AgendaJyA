

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jesús & Ali - Finanzas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #e11d48;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 15px;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--text);
      font-weight: 700;
    }

    header h1 span {
      color: var(--accent);
    }

    /* Pestañas */
    .tabs-nav {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-content.active {
      display: flex;
    }

    /* Indicadores / Filtros */
    .date-indicator {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      background: #0f172a;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .filter-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .filter-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="month"] {
      background: #1e293b;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      width: 100%;
      text-align: center;
    }

    /* Columnas Diarias */
    .columns-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .col {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 260px;
    }

    .col h2 {
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .title-ingresos { color: var(--green); }
    .title-gastos { color: var(--red); }

    .items-list {
      list-style: none;
      flex-grow: 1;
      overflow-y: auto;
      max-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .items-list li {
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid var(--border);
    }

    .items-list.ingresos li { border-left-color: var(--green); }
    .items-list.gastos li { border-left-color: var(--red); }

    .delete-btn {
      color: var(--text-muted);
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .delete-btn:hover { 
      color: var(--red);
      background: rgba(239, 68, 68, 0.1);
    }

    .add-btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1e293b;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:active {
      transform: scale(0.98);
      background: var(--accent);
    }

    /* Tarjetas de Resumen */
    .summary-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .summary-item .label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .summary-item .value {
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Contenedor Gráfica Mensual */
    .chart-container {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 250px;
    }

    .balance-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .balance-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .balance-amount {
      font-size: 1.6rem;
      font-weight: 800;
    }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Chart.js para la gráfica de torta/dona -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Jesús <span>&</span> Ali</h1>
    </header>

    <!-- Navegación -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('daily', event)">☀️ Hoy</button>
      <button class="tab-btn" onclick="switchTab('monthly', event)">📅 Consulta Mensual</button>
    </div>

    <!-- PESTAÑA 1: DÍA A DÍA -->
    <div id="tab-daily" class="tab-content active">
      <div class="date-indicator" id="todayLabel"></div>

      <div class="columns-grid">
        <div class="col">
          <h2 class="title-ingresos">Ingresos</h2>
          <ul class="items-list ingresos" id="dailyIngresosList"></ul>
          <button class="add-btn" onclick="addRecord('ingreso')">+ Añadir</button>
        </div>
        <div class="col">
          <h2 class="title-gastos">Gastos</h2>
          <ul class="items-list gastos" id="dailyGastosList"></ul>
          <button class="add-btn" onclick="addRecord('gasto')">+ Añadir</button>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-item">
          <span class="label">Ingresos del Día</span>
          <span class="value" id="dailyTotalIngresos" style="color: var(--green);">$0</span>
        </div>
        <div class="summary-item">
          <span class="label">Gastos del Día</span>
          <span class="value" id="dailyTotalGastos" style="color: var(--red);">$0</span>
        </div>
      </div>
    </div>

    <!-- PESTAÑA 2: CONSULTA MENSUAL -->
    <div id="tab-monthly" class="tab-content">
      <div class="filter-box">
        <label for="monthPicker">Seleccionar Mes a Consultar</label>
        <input type="month" id="monthPicker" onchange="renderData()">
      </div>

      <!-- Gráfico de Torta / Dona -->
      <div class="chart-container">
        <canvas id="monthlyChart"></canvas>
      </div>

      <div class="summary-card">
        <div class="summary-item">
          <span class="label">Ingresos Mes</span>
          <span class="value" id="monthlyTotalIngresos" style="color: var(--green);">$0</span>
        </div>
        <div class="summary-item">
          <span class="label">Gastos Mes</span>
          <span class="value" id="monthlyTotalGastos" style="color: var(--red);">$0</span>
        </div>
      </div>

      <!-- Balance Neto Final -->
      <div class="balance-card">
        <span class="balance-title">Balance Neto del Mes</span>
        <span class="balance-amount" id="monthlyBalance">$0</span>
      </div>
    </div>
  </div>

  <script>
    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCbsHxOR1w4gDjQCAV0cdej3CEp83-WQs0",
      authDomain: "agendajya-94e6c.firebaseapp.com",
      databaseURL: "https://agendajya-94e6c-default-rtdb.firebaseio.com",
      projectId: "agendajya-94e6c",
      storageBucket: "agendajya-94e6c.firebasestorage.app",
      messagingSenderId: "195399447529",
      appId: "1:195399447529:web:b708fb0ff0da63ac481178",
      measurementId: "G-7B1H0QLFRG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Variables de fecha
    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);
    const currentMonthStr = today.toISOString().slice(0, 7);

    document.getElementById('todayLabel').innerText = `Hoy: ${today.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
    
    const monthPicker = document.getElementById('monthPicker');
    monthPicker.value = currentMonthStr;

    let allRecords = {};
    let chartInstance = null;

    // Pedir permisos de notificación al abrir la app
    document.addEventListener('DOMContentLoaded', () => {
      if ("Notification" in window) {
        Notification.requestPermission();
      }
    });

    // Función auxiliar para enviar notificación local
    function sendNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          icon: "https://cdn-icons-png.flaticon.com/512/2953/2953363.png"
        });
      }
    }

    // Cambiar Pestañas
    function switchTab(tab, e) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      e.target.classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    // Escuchar cambios en la nube
    db.ref('registros').on('value', (snapshot) => {
      allRecords = snapshot.val() || {};
      renderData();
    });

    // Añadir Registro + Notificación Instantánea
    function addRecord(type) {
      const desc = prompt(`Descripción del ${type}:`);
      if (!desc) return;

      const amount = parseFloat(prompt(`Monto ($):`));
      if (isNaN(amount) || amount <= 0) {
        alert("Ingresa un monto válido.");
        return;
      }

      const newRef = db.ref('registros').push();
      newRef.set({
        type: type,
        description: desc,
        amount: amount,
        date: new Date().toISOString()
      }).then(() => {
        const emoji = type === 'ingreso' ? '💰' : '💸';
        const titleLabel = type === 'ingreso' ? '¡Nuevo Ingreso!' : '¡Nuevo Gasto!';
        sendNotification(titleLabel, `${emoji} ${desc}: $${amount.toLocaleString()}`);
      });
    }

    // Eliminar Registro
    function deleteRecord(id) {
      if (confirm("¿Estás seguro de borrar este registro?")) {
        db.ref('registros/' + id).remove();
      }
    }

    // Comprobar y disparar notificaciones programadas (Diarias y Fin de Mes)
    function checkScheduledNotifications(dailyIng, dailyGas, monthlyIng, monthlyGas) {
      const now = new Date();
      const currentHour = now.getHours();
      const lastDailyCheck = localStorage.getItem('lastDailyNotification');
      const lastMonthlyCheck = localStorage.getItem('lastMonthlyNotification');

      // 1. Notificación Diaria (después de las 8 PM)
      if (currentHour >= 20 && lastDailyCheck !== todayStr) {
        const dailyBalance = dailyIng - dailyGas;
        const emoji = dailyBalance >= 0 ? '📈' : '📉';
        sendNotification(
          '☀️ Balance del Día',
          `${emoji} Ingresos: $${dailyIng.toLocaleString()} | Gastos: $${dailyGas.toLocaleString()} (Neto: $${dailyBalance.toLocaleString()})`
        );
        localStorage.setItem('lastDailyNotification', todayStr);
      }

      // 2. Notificación Fin de Mes (Último día del mes después de las 8 PM)
      const isLastDayOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() === now.getDate();
      if (isLastDayOfMonth && currentHour >= 20 && lastMonthlyCheck !== currentMonthStr) {
        const monthlyBalance = monthlyIng - monthlyGas;
        const emoji = monthlyBalance >= 0 ? '🎉' : '⚠️';
        sendNotification(
          '📅 Balance del Mes',
          `${emoji} Balance Neto del Mes: $${monthlyBalance.toLocaleString()} (Ingresos: $${monthlyIng.toLocaleString()} | Gastos: $${monthlyGas.toLocaleString()})`
        );
        localStorage.setItem('lastMonthlyNotification', currentMonthStr);
      }
    }

    // Renderizar Listas y Gráfica
    function renderData() {
      // Día
      const dailyIngresos = document.getElementById('dailyIngresosList');
      const dailyGastos = document.getElementById('dailyGastosList');
      dailyIngresos.innerHTML = '';
      dailyGastos.innerHTML = '';
      let dailyTotalIng = 0, dailyTotalGas = 0;

      // Mes
      const selectedMonth = monthPicker.value;
      let monthlyTotalIng = 0, monthlyTotalGas = 0;

      Object.keys(allRecords).forEach(key => {
        const item = allRecords[key];
        const itemDateStr = item.date ? item.date.slice(0, 10) : "";
        const itemMonthStr = item.date ? item.date.slice(0, 7) : "";

        // Solo Hoy
        if (itemDateStr === todayStr) {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${item.description} (<b>$${item.amount.toLocaleString()}</b>)</span>
            <span class="delete-btn" onclick="deleteRecord('${key}')">✕</span>
          `;
          if (item.type === 'ingreso') {
            dailyIngresos.appendChild(li);
            dailyTotalIng += item.amount;
          } else {
            dailyGastos.appendChild(li);
            dailyTotalGas += item.amount;
          }
        }

        // Totales del Mes Seleccionado
        if (itemMonthStr === selectedMonth) {
          if (item.type === 'ingreso') {
            monthlyTotalIng += item.amount;
          } else {
            monthlyTotalGas += item.amount;
          }
        }
      });

      // Actualizar Totales del Día
      document.getElementById('dailyTotalIngresos').innerText = `$${dailyTotalIng.toLocaleString()}`;
      document.getElementById('dailyTotalGastos').innerText = `$${dailyTotalGas.toLocaleString()}`;

      // Actualizar Totales del Mes
      document.getElementById('monthlyTotalIngresos').innerText = `$${monthlyTotalIng.toLocaleString()}`;
      document.getElementById('monthlyTotalGastos').innerText = `$${monthlyTotalGas.toLocaleString()}`;

      // Balance Neto (Ingresos - Gastos)
      const balance = monthlyTotalIng - monthlyTotalGas;
      const balanceElem = document.getElementById('monthlyBalance');
      
      if (balance >= 0) {
        balanceElem.style.color = 'var(--green)';
        balanceElem.innerText = `+$${balance.toLocaleString()}`;
      } else {
        balanceElem.style.color = 'var(--red)';
        balanceElem.innerText = `-$${Math.abs(balance).toLocaleString()}`;
      }

      // Renderizar la Gráfica de Torta
      renderChart(monthlyTotalIng, monthlyTotalGas);

      // Revisar notificaciones programadas
      checkScheduledNotifications(dailyTotalIng, dailyTotalGas, monthlyTotalIng, monthlyTotalGas);
    }

    // Dibujar/Actualizar la Gráfica
    function renderChart(ingresos, gastos) {
      const ctx = document.getElementById('monthlyChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Ingresos', 'Gastos'],
          datasets: [{
            data: [ingresos, gastos],
            backgroundColor: ['#22c55e', '#ef4444'],
            borderColor: '#1e293b',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: '#f8fafc',
                font: { size: 13 }
              }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
